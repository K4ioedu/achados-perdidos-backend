spring.application.name=achados-perdidos-ufc

# CONFIGURACAO DE BANCO DE DADOS HIBRIDA
# Tenta pegar a URL da variavel de ambiente (Nuvem), senao usa o localhost (Seu PC)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/achados_perdidos_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:goku}

# Configuracoes do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Upload de Arquivos (Ajuste para imagens)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB